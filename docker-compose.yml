services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: peex-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Placeholder_ChangeMe123!}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - peex-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peex-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PeexDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Placeholder_ChangeMe123!};TrustServerCertificate=True;"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Jwt__Key: ${JWT_KEY:?defina JWT_KEY no arquivo .env}
      Jwt__Issuer: "PeexLearning"
      Jwt__Audience: "PeexLearningClient"
      Jwt__AccessTokenMinutos: "15"
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - peex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: peex-frontend
    environment:
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - peex-network

networks:
  peex-network:
    driver: bridge

volumes:
  mssql-data:
